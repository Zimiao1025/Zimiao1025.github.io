<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">A1 removes a resource-selection provider call</title>
  <desc id="desc">The provider selector uses one paid model call before the shared P5 and evidence-constraint loop. The registry compiler uses the public task type and frozen inventory to produce the same bounded receipt with zero provider calls.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#61788c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#182633" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1500" height="880" rx="30" fill="#f0efec"/>
  <text x="78" y="84" fill="#182633" font-family="Georgia, serif" font-size="48">Remove a whole call—not a few fields</text>
  <text x="80" y="128" fill="#666e72" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="19">A1 compiles registered capabilities locally and leaves the downstream research loop unchanged.</text>

  <g filter="url(#shadow)" font-family="Avenir Next, Helvetica, Arial, sans-serif">
    <rect x="78" y="206" width="600" height="492" rx="30" fill="#e6e4df"/>
    <rect x="822" y="206" width="600" height="492" rx="30" fill="#182633"/>
  </g>

  <g font-family="Avenir Next, Helvetica, Arial, sans-serif">
    <text x="122" y="256" fill="#866550" font-size="14" font-weight="800" letter-spacing="3">PROVIDER SELECTOR · CONTROL</text>
    <rect x="126" y="310" width="210" height="94" rx="18" fill="#61788c"/>
    <text x="231" y="348" text-anchor="middle" fill="#f0efec" font-size="15" font-weight="800">TASK + INVENTORY</text>
    <text x="231" y="377" text-anchor="middle" fill="#e6e4df" font-size="14">large prompt</text>
    <path d="M336 357H401" fill="none" stroke="#61788c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="418" y="310" width="210" height="94" rx="18" fill="#866550"/>
    <text x="523" y="348" text-anchor="middle" fill="#f0efec" font-size="15" font-weight="800">MODEL CALL</text>
    <text x="523" y="377" text-anchor="middle" fill="#f0efec" font-size="14">1 provider request</text>
    <path d="M523 404V470" fill="none" stroke="#61788c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="272" y="486" width="212" height="92" rx="18" fill="#2f4944"/>
    <text x="378" y="524" text-anchor="middle" fill="#f0efec" font-size="15" font-weight="800">RESOURCE RECEIPT</text>
    <text x="378" y="553" text-anchor="middle" fill="#e6e4df" font-size="14">then shared loop</text>
    <text x="378" y="642" text-anchor="middle" fill="#866550" font-family="Georgia, serif" font-size="30">Paid rediscovery</text>

    <text x="866" y="256" fill="#a8846d" font-size="14" font-weight="800" letter-spacing="3">A1 · REGISTRY COMPILER</text>
    <rect x="870" y="310" width="210" height="94" rx="18" fill="#61788c"/>
    <text x="975" y="348" text-anchor="middle" fill="#f0efec" font-size="15" font-weight="800">TASK TYPE</text>
    <text x="975" y="377" text-anchor="middle" fill="#e6e4df" font-size="14">public contract</text>
    <path d="M1080 357H1145" fill="none" stroke="#a8846d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1162" y="310" width="210" height="94" rx="18" fill="#526e68"/>
    <text x="1267" y="348" text-anchor="middle" fill="#f0efec" font-size="15" font-weight="800">LOCAL COMPILE</text>
    <text x="1267" y="377" text-anchor="middle" fill="#e6e4df" font-size="14">0 provider calls</text>
    <path d="M1267 404V470" fill="none" stroke="#a8846d" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1016" y="486" width="212" height="92" rx="18" fill="#a8846d"/>
    <text x="1122" y="524" text-anchor="middle" fill="#182633" font-size="15" font-weight="800">RESOURCE RECEIPT</text>
    <text x="1122" y="553" text-anchor="middle" fill="#182633" font-size="14">same shared loop</text>
    <text x="1122" y="642" text-anchor="middle" fill="#f0efec" font-family="Georgia, serif" font-size="30">Deterministic reuse</text>
  </g>

  <rect x="284" y="742" width="932" height="76" rx="38" fill="#2f4944"/>
  <text x="750" y="776" text-anchor="middle" fill="#a8846d" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3">BOTH ARMS ENTER THE SAME P5 + EVIDENCE-CONSTRAINT LOOP</text>
  <text x="750" y="802" text-anchor="middle" fill="#e6e4df" fill-opacity=".72" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15">Unknown profile or inventory drift; fail closed to the provider path</text>
  <path d="M378 578V720" fill="none" stroke="#61788c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1122 578V720" fill="none" stroke="#61788c" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
