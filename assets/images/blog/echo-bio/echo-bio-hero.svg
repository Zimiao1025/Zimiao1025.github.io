<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Echo-Bio evidence-constrained research loop</title>
  <desc id="desc">A fixed research model is surrounded by planning, execution, evidence, verification, and harness evolution in a governed loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182633"/>
      <stop offset="0.6" stop-color="#223936"/>
      <stop offset="1" stop-color="#2f4944"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a8846d" stop-opacity=".26"/>
      <stop offset="1" stop-color="#a8846d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8846d"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0b1318" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="820" cy="450" r="390" fill="url(#glow)"/>
  <g fill="none" stroke="#e6e4df" stroke-opacity=".12">
    <ellipse cx="820" cy="450" rx="540" ry="290" transform="rotate(-11 820 450)"/>
    <ellipse cx="820" cy="450" rx="490" ry="350" transform="rotate(18 820 450)" stroke-dasharray="7 13"/>
    <ellipse cx="820" cy="450" rx="380" ry="380" stroke="#61788c" stroke-opacity=".24"/>
  </g>
  <path d="M 365 540 C 250 390 370 210 580 170 C 850 120 1145 205 1270 385 C 1390 558 1235 728 1020 752 C 790 778 570 690 510 532"
        fill="none" stroke="#a8846d" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 362 540 C 295 440 310 330 395 245" fill="none" stroke="#e6e4df" stroke-opacity=".22" stroke-width="2" stroke-dasharray="6 10"/>

  <g filter="url(#shadow)">
    <circle cx="820" cy="450" r="154" fill="#f0efec"/>
    <circle cx="820" cy="450" r="132" fill="none" stroke="#182633" stroke-opacity=".12"/>
    <path d="M765 422c-5-38 47-62 72-32 35-12 64 23 50 54 28 22 9 67-27 66-20 34-70 24-75-14-34-8-40-55-20-74Z"
          fill="none" stroke="#2f4944" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M785 407c19 7 24 24 20 42m47-59c-11 12-12 30-3 44m-63 62c9-18 25-26 44-22m29-44c-20 4-31 16-34 35"
          fill="none" stroke="#a8846d" stroke-width="6" stroke-linecap="round"/>
    <text x="820" y="565" text-anchor="middle" fill="#182633" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">FIXED RESEARCH MODEL</text>
  </g>

  <g font-family="Avenir Next, Helvetica, Arial, sans-serif">
    <g transform="translate(280 244)">
      <circle r="64" fill="#61788c"/>
      <path d="M-22 10 0-12l22 22M0-12v-19" fill="none" stroke="#f0efec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="103" text-anchor="middle" fill="#e6e4df" font-size="18" font-weight="700" letter-spacing="2">PLAN</text>
    </g>
    <g transform="translate(565 130)">
      <circle r="64" fill="#2f4944" stroke="#526e68" stroke-width="3"/>
      <path d="M-22-18h44v36h-44zM-9 30h18M0 18v12" fill="none" stroke="#f0efec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="103" text-anchor="middle" fill="#e6e4df" font-size="18" font-weight="700" letter-spacing="2">EXECUTE</text>
    </g>
    <g transform="translate(1090 155)">
      <circle r="64" fill="#866550"/>
      <path d="M-25-20h50v42h-50zM-13-7h26M-13 5h18" fill="none" stroke="#f0efec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="103" text-anchor="middle" fill="#e6e4df" font-size="18" font-weight="700" letter-spacing="2">EVIDENCE</text>
    </g>
    <g transform="translate(1320 445)">
      <circle r="64" fill="#526e68"/>
      <path d="m-26 0 16 17 37-41" fill="none" stroke="#f0efec" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="103" text-anchor="middle" fill="#e6e4df" font-size="18" font-weight="700" letter-spacing="2">VERIFY</text>
    </g>
    <g transform="translate(1040 756)">
      <circle r="64" fill="#61788c"/>
      <path d="M-27 12C-20-22 20-31 34-4M28-18l7 15-16 4M27 5C18 32-22 36-35 10M-28 25l-7-15 16-4" fill="none" stroke="#f0efec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="103" text-anchor="middle" fill="#e6e4df" font-size="18" font-weight="700" letter-spacing="2">EVOLVE</text>
    </g>
    <g transform="translate(510 690)">
      <circle r="64" fill="#a8846d"/>
      <path d="M-26-21h52v42h-52zM-14-8h28M-14 5h18" fill="none" stroke="#182633" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="103" text-anchor="middle" fill="#e6e4df" font-size="18" font-weight="700" letter-spacing="2">RECEIPT</text>
    </g>
  </g>

  <g transform="translate(82 760)" font-family="Avenir Next, Helvetica, Arial, sans-serif">
    <text fill="#a8846d" font-size="17" font-weight="700" letter-spacing="4">ECHO-BIO</text>
    <text y="34" fill="#e6e4df" fill-opacity=".64" font-size="18">Optimize the harness. Preserve the science.</text>
  </g>
</svg>
